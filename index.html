<!DOCTYPE html>

<head>

  <!-- LIBRARY BARCODE SCANNER -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          135deg,

          #f4f7f6
        );

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }


    .container {

      width: 100%;

      max-width: 520px;

    }


    .card {

      background: white;

      border-radius: 24px;

      padding: 25px;

      box-shadow:
        0 15px 40px
        rgba(0,0,0,0.10);

      text-align: center;

    }


    .logo {

      font-size: 42px;

      margin-bottom: 5px;

    }


    h1 {

      margin: 0;

      color: #1b5e20;

      font-size: 28px;

    }


    .school {

      margin-top: 6px;

      color: #666;

      font-size: 15px;

    }


    .subtitle {

      margin-top: 22px;

      font-weight: bold;

      font-size: 18px;

      color: #333;

    }


    #reader {

      width: 100%;

      margin-top: 20px;

      border-radius: 18px;

      overflow: hidden;

      background: #111;

    }


    #reader video {

      border-radius: 18px;

    }


    .status {

      margin-top: 15px;

      padding: 14px;

      border-radius: 12px;

      background: #f1f8f2;

      color: #1b5e20;

      font-size: 15px;

      font-weight: bold;

      white-space: pre-line;

    }


    .hasil {

      margin-top: 18px;

      padding: 20px;

      border-radius: 15px;

      display: none;

    }


    .berhasil {

      background: #e8f5e9;

      color: #1b5e20;

    }


    .error {

      background: #ffebee;

      color: #b71c1c;

    }


    .barcode {

      margin-top: 10px;

      font-size: 30px;

      font-weight: bold;

    }


    .footer {

      margin-top: 20px;

      color: #999;

      font-size: 12px;

    }

  </style>

</head>

<body>

  <div class="container">

```
<div class="card">

```

  </div>

  <script>


    let scanner;

    let sedangScan =
      false;


    // ==================================================
    // MULAI SCANNER
    // ==================================================

    function mulaiScanner() {


      const status =
        document.getElementById(
          "status"
        );


      status.innerText =
        "📷 Menyiapkan kamera...";


      scanner =
        new Html5Qrcode(
          "reader"
        );


      Html5Qrcode.getCameras()


        .then(function(cameras) {


          if (
            !cameras ||
            cameras.length === 0
          ) {

            status.innerText =
              "❌ Kamera tidak ditemukan.";

            return;

          }


          // ==========================================
          // PILIH KAMERA BELAKANG
          // ==========================================

          let kameraId =
            cameras[0].id;


          for (
            let i = 0;
            i < cameras.length;
            i++
          ) {


            const label =
              (
                cameras[i].label ||
                ""
              ).toLowerCase();


            if (

              label.includes("back") ||

              label.includes("rear") ||

              label.includes("environment")

            ) {

              kameraId =
                cameras[i].id;

              break;

            }

          }


          // ==========================================
          // START CAMERA
          // ==========================================

          scanner.start(

            kameraId,

            {

              fps: 10,

              qrbox: {

                width: 300,

                height: 160

              }

            },


            function(decodedText) {


              if (
                sedangScan
              ) {

                return;

              }


              sedangScan =
                true;


              barcodeTerbaca(
                decodedText
              );


            },


            function(errorMessage) {

              // Jangan tampilkan
              // error scanning

            }

          )


          .then(function() {


            status.innerText =
              "🟢 SCANNER SIAP\n\n" +
              "Arahkan BC001 ke kamera.";


          })


          .catch(function(error) {


            console.error(
              error
            );


            status.innerText =
              "❌ Kamera gagal dimulai.";

          });


        })


        .catch(function(error) {


          console.error(
            error
          );


          status.innerText =
            "❌ Tidak dapat mengakses kamera.";

        });

    }



    // ==================================================
    // BARCODE TERBACA
    // ==================================================

    function barcodeTerbaca(
      barcode
    ) {


      const status =
        document.getElementById(
          "status"
        );


      const hasil =
        document.getElementById(
          "hasil"
        );


      // ==========================================
      // HENTIKAN SCAN SEMENTARA
      // ==========================================

      try {

        scanner.pause(
          true
        );

      }

      catch (error) {

        console.log(
          error
        );

      }


      // ==========================================
      // TAMPILKAN HASIL
      // ==========================================

      status.innerText =
        "🟢 BARCODE TERBACA!";


      hasil.style.display =
        "block";


      hasil.className =
        "hasil berhasil";


      hasil.innerHTML = `

        <div>
          ✓ BARCODE BERHASIL DIBACA
        </div>

        <div class="barcode">
          ${barcode}
        </div>

      `;


      // ==========================================
      // TUNGGU LALU SIAP SCAN LAGI
      // ==========================================

      setTimeout(
        function() {


          hasil.style.display =
            "none";


          sedangScan =
            false;


          try {

            scanner.resume();

          }

          catch (error) {

            console.log(
              error
            );

          }


          status.innerText =
            "🟢 SCANNER SIAP\n\n" +
            "Arahkan barcode ke kamera.";


        },
        2500
      );

    }



    // ==================================================
    // JALANKAN SAAT HALAMAN DIBUKA
    // ==================================================

    window.addEventListener(
      "load",
      function() {

        mulaiScanner();

      }
    );


  </script>

</body>

</html>
