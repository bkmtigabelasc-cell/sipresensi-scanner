<!DOCTYPE html>

<html lang="id">

<head>

  <meta charset="UTF-8">

<meta name="viewport"
     content="width=device-width, initial-scale=1.0">

  <title>SIPRESENSI 13 - Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.10);
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #1b5e20;
      font-size: 28px;
    }

    .school {
      margin-top: 6px;
      color: #666;
      font-size: 15px;
    }

    .subtitle {
      margin-top: 22px;
      font-weight: bold;
      font-size: 18px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
      border-radius: 18px;
      overflow: hidden;
      background: #111;
    }

    #status {
      margin-top: 15px;
      padding: 14px;
      border-radius: 12px;
      background: #f1f8f2;
      color: #1b5e20;
      font-weight: bold;
      white-space: pre-line;
    }

    #hasil {
      margin-top: 18px;
      padding: 20px;
      border-radius: 15px;
      display: none;
    }

    .berhasil {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .error {
      background: #ffebee;
      color: #b71c1c;
    }

    .nama {
      margin-top: 10px;
      font-size: 25px;
      font-weight: bold;
    }

    .detail {
      margin-top: 6px;
      font-size: 16px;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="card">

```
<h1>SIPRESENSI 13</h1>

<div class="school">
  MTsN 13 Ciamis
</div>

<div class="subtitle">
  SCANNER BARCODE ABSENSI
</div>

<div id="reader"></div>

<div id="status">
  ⏳ Menyiapkan scanner...
</div>

<div id="hasil"></div>
```

  </div>

</div>

<script>


// ======================================================
// URL WEB APP APPS SCRIPT
// ======================================================

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbzgKtb2IyODbg4FbgfgWo3XkJ_k0OaL0kU5iZjWH95vqxgzz-nx0iNBwAogH0qwJCYY/exec";


// ======================================================
// VARIABEL
// ======================================================

let scanner = null;

let sedangProses = false;


// ======================================================
// MULAI SCANNER
// ======================================================

function mulaiScanner() {

  const status =
    document.getElementById("status");

  status.innerText =
    "📷 Meminta akses kamera...";


  scanner =
    new Html5Qrcode("reader");


  Html5Qrcode.getCameras()

    .then(function(cameras) {

      if (!cameras || cameras.length === 0) {

        status.innerText =
          "❌ Kamera tidak ditemukan.";

        return;

      }


      // Pilih kamera belakang

      let kameraId =
        cameras[0].id;


      for (
        let i = 0;
        i < cameras.length;
        i++
      ) {

        const label =
          (
            cameras[i].label || ""
          ).toLowerCase();


        if (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        ) {

          kameraId =
            cameras[i].id;

          break;

        }

      }


      scanner.start(

        kameraId,

        {
          fps: 10,

          qrbox: {
            width: 300,
            height: 160
          },

          formatsToSupport: [

            Html5QrcodeSupportedFormats.CODE_128,

            Html5QrcodeSupportedFormats.CODE_39,

            Html5QrcodeSupportedFormats.EAN_13,

            Html5QrcodeSupportedFormats.EAN_8,

            Html5QrcodeSupportedFormats.UPC_A,

            Html5QrcodeSupportedFormats.UPC_E,

            Html5QrcodeSupportedFormats.ITF

          ]

        },


        function(decodedText) {

          if (sedangProses) {
            return;
          }

          sedangProses = true;

          prosesHasilScan(
            decodedText
          );

        },


        function(errorMessage) {

          // Abaikan error pembacaan
          // selama kamera aktif

        }

      )

      .then(function() {

        status.innerText =
          "🟢 SCANNER SIAP\n\n" +
          "Arahkan barcode kartu siswa.";

      })

      .catch(function(error) {

        console.error(error);

        status.innerText =
          "❌ Scanner gagal dimulai.";

      });

    })


    .catch(function(error) {

      console.error(error);

      status.innerText =
        "❌ Tidak dapat mengakses kamera.";

    });

}


// ======================================================
// HASIL BARCODE
// ======================================================

function prosesHasilScan(
  hasilScan
) {

  const status =
    document.getElementById("status");

  const hasil =
    document.getElementById("hasil");


  status.innerText =
    "🔍 Barcode terbaca:\n" +
    hasilScan +
    "\n\n⏳ Mencatat absensi...";


  hasil.style.display =
    "block";

  hasil.className =
    "hasil";


  // ====================================================
  // KIRIM KE APPS SCRIPT
  // ====================================================

  const url =
    URL_APPS_SCRIPT +
    "?action=absensi" +
    "&hasilScan=" +
    encodeURIComponent(
      hasilScan
    ) +
    "&callback=hasilAbsensi";


  const script =
    document.createElement("script");


  script.src = url;


  script.onerror =
    function() {

      tampilkanError(
        "Tidak dapat terhubung ke server absensi."
      );

    };


  document.body.appendChild(
    script
  );

}


// ======================================================
// CALLBACK DARI APPS SCRIPT
// ======================================================

function hasilAbsensi(
  response
) {


  const hasil =
    document.getElementById("hasil");

  const status =
    document.getElementById("status");


  if (
    response &&
    response.success
  ) {


    hasil.style.display =
      "block";

    hasil.className =
      "hasil berhasil";


    hasil.innerHTML = `

      <div>
        ✓ ABSENSI BERHASIL
      </div>

      <div class="nama">
        ${response.nama}
      </div>

      <div class="detail">
        Kelas ${response.kelas}
      </div>

      <div class="detail">
        Status: ${response.status}
      </div>

      <div class="detail">
        Jam: ${response.jam}
      </div>

    `;


    status.innerText =
      "🟢 ABSENSI TERCATAT";


    // Suara

    bicara(
      "Absensi berhasil"
    );


  }

  else {


    hasil.style.display =
      "block";

    hasil.className =
      "hasil error";


    hasil.innerHTML = `

      <div>
        ⚠️ ABSENSI GAGAL
      </div>

      <div class="detail">
        ${
          response &&
          response.message
            ? response.message
            : "Terjadi kesalahan."
        }
      </div>

    `;


    status.innerText =
      "🔴 ABSENSI GAGAL";


    bicara(
      "Absensi gagal"
    );

  }


  // ====================================================
  // SIAP SCAN LAGI
  // ====================================================

  setTimeout(
    function() {


      hasil.style.display =
        "none";


      sedangProses =
        false;


      status.innerText =
        "🟢 SCANNER SIAP\n\n" +
        "Arahkan barcode kartu siswa.";


    },
    3000
  );

}


// ======================================================
// ERROR
// ======================================================

function tampilkanError(
  pesan
) {

  const hasil =
    document.getElementById("hasil");

  const status =
    document.getElementById("status");


  hasil.style.display =
    "block";

  hasil.className =
    "hasil error";

  hasil.innerHTML =
    "⚠️ " + pesan;


  status.innerText =
    "🔴 GAGAL";

  bicara(
    "Absensi gagal"
  );


  setTimeout(
    function() {

      hasil.style.display =
        "none";

      sedangProses =
        false;

      status.innerText =
        "🟢 SCANNER SIAP";

    },
    3000
  );

}


// ======================================================
// SUARA
// ======================================================

function bicara(
  teks
) {

  if (
    "speechSynthesis"
    in window
  ) {

    const suara =
      new SpeechSynthesisUtterance(
        teks
      );

    suara.lang =
      "id-ID";

    suara.rate =
      1;

    window.speechSynthesis.speak(
      suara
    );

  }

}


// ======================================================
// JALANKAN
// ======================================================

window.addEventListener(
  "load",
  function() {

    mulaiScanner();

  }
);


</script>

</body>

</html>
