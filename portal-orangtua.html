  </div>

  <script>

    // ==================================================
    // LOGIN
    // ==================================================

    function login() {

      const nisn =
        document
          .getElementById("nisn")
          .value
          .trim();


      const nama =
        document
          .getElementById("nama")
          .value
          .trim();


      const btn =
        document
          .getElementById("btnLogin");


      if (!nisn || !nama) {

        tampilkanPesan(
          "NISN dan nama anak wajib diisi.",
          "error"
        );

        return;

      }


      btn.disabled = true;

      btn.innerText =
        "MEMERIKSA DATA...";


      tampilkanPesan(
        "⏳ Sedang memeriksa data...",
        "loading"
      );


      // =================================================
      // URL WEB APP GOOGLE APPS SCRIPT
      // =================================================

      const URL_APPS_SCRIPT =
        "https://script.google.com/macros/s/AKfycbzgKtb2IyODbg4FbgfgWo3XkJ_k0OaL0kU5iZjWH95vqxgzz-nx0iNBwAogH0qwJCYY/exec";


      fetch(
        URL_APPS_SCRIPT,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            action:
              "loginOrangtua",

            nisn:
              nisn,

            nama:
              nama

          })

        }
      )

      .then(response =>
        response.json()
      )

      .then(data => {

        btn.disabled = false;

        btn.innerText =
          "LIHAT KEHADIRAN";


        if (data.success) {

          tampilkanDashboard(data);

        }

        else {

          tampilkanPesan(
            data.message ||
            "Data tidak ditemukan.",
            "error"
          );

        }

      })

      .catch(error => {

        btn.disabled = false;

        btn.innerText =
          "LIHAT KEHADIRAN";


        tampilkanPesan(
          "Tidak dapat terhubung ke server.",
          "error"
        );


        console.error(error);

      });

    }


    // ==================================================
    // PESAN
    // ==================================================

    function tampilkanPesan(
      text,
      type
    ) {

      const pesan =
        document
          .getElementById("pesan");


      pesan.style.display =
        "block";

      pesan.className =
        type;

      pesan.innerText =
        text;

    }


    // ==================================================
    // DASHBOARD
    // ==================================================

    function tampilkanDashboard(data) {

      document
        .getElementById("loginCard")
        .style.display =
        "none";


      document
        .getElementById("dashboard")
        .style.display =
        "block";


      document
        .getElementById("namaAnak")
        .innerText =
        data.akun.namaSiswa;


      document
        .getElementById("kelasAnak")
        .innerText =
        "Kelas " +
        data.akun.kelas;


      document
        .getElementById("hadir")
        .innerText =
        data.rekap.hadir;


      document
        .getElementById("terlambat")
        .innerText =
        data.rekap.terlambat;


      document
        .getElementById("sakit")
        .innerText =
        data.rekap.sakit;


      document
        .getElementById("izin")
        .innerText =
        data.rekap.izin;


      document
        .getElementById("alpa")
        .innerText =
        data.rekap.alpa;


      tampilkanRiwayat(
        data.riwayat
      );

    }


    // ==================================================
    // RIWAYAT
    // ==================================================

    function tampilkanRiwayat(
      riwayat
    ) {

      const container =
        document
          .getElementById("riwayat");


      container.innerHTML =
        "";


      if (
        !riwayat ||
        riwayat.length === 0
      ) {

        container.innerHTML =
          '<div class="kosong">' +
          'Belum ada data kehadiran.' +
          '</div>';

        return;

      }


      // Terbaru di atas

      const data =
        [...riwayat].reverse();


      data.forEach(
        function(item) {

          const div =
            document.createElement(
              "div"
            );


          div.className =
            "riwayat-item";


          const status =
            String(
              item.status || ""
            )
            .toLowerCase();


          let statusClass =
            "";


          if (
            status === "hadir"
          ) {

            statusClass =
              "hadir";

          }

          else if (
            status === "terlambat"
          ) {

            statusClass =
              "terlambat";

          }

          else if (
            status === "sakit"
          ) {

            statusClass =
              "sakit";

          }

          else if (
            status === "izin"
          ) {

            statusClass =
              "izin";

          }

          else if (
            status === "alpa"
          ) {

            statusClass =
              "alpa";

          }


          div.innerHTML = `

            <div class="tanggal">
              ${item.tanggal}
            </div>

            <div class="detail">
              ${item.hari}
              •
              ${item.jam}
            </div>

            <span class="status ${statusClass}">
              ${item.status}
            </span>

          `;


          container.appendChild(
            div
          );

        }
      );

    }


    // ==================================================
    // LOGOUT
    // ==================================================

    function logout() {

      document
        .getElementById("dashboard")
        .style.display =
        "none";


      document
        .getElementById("loginCard")
        .style.display =
        "block";


      document
        .getElementById("nisn")
        .value =
        "";


      document
        .getElementById("nama")
        .value =
        "";


      document
        .getElementById("pesan")
        .style.display =
        "none";

    }


    // ==================================================
    // ENTER
    // ==================================================

    document
      .getElementById("nama")
      .addEventListener(
        "keypress",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            login();

          }

        }
      );

  </script>
