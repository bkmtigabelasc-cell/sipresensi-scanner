<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Portal Orang Tua - SIPRESENSI 13</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.08);

      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      color: #1b5e20;
    }

    .school {
      margin-top: 6px;
      color: #666;
    }

    .subtitle {
      margin-top: 25px;
      font-weight: bold;
      font-size: 19px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 15px;

      font-size: 16px;

      border:
        1px solid #ddd;

      border-radius: 10px;
    }

    button {
      width: 100%;

      margin-top: 15px;

      padding: 15px;

      font-size: 17px;

      border: none;

      border-radius: 10px;

      cursor: pointer;

      background: #1b5e20;

      color: white;

      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    #hasil {
      margin-top: 25px;
    }

    .success {
      background: #e8f5e9;

      color: #1b5e20;

      padding: 20px;

      border-radius: 12px;
    }

    .error {
      background: #ffebee;

      color: #b71c1c;

      padding: 20px;

      border-radius: 12px;
    }

    .nama {
      font-size: 23px;

      font-weight: bold;

      margin-top: 8px;
    }

    .kelas {
      margin-top: 5px;

      font-size: 16px;
    }

    .rekap {
      margin-top: 20px;

      text-align: left;

      background: white;

      padding: 15px;

      border-radius: 10px;
    }

    .riwayat {
      margin-top: 10px;

      padding: 12px;

      background: white;

      border-radius: 10px;

      text-align: left;
    }

    .logout {
      margin-top: 15px;

      background: #757575;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="card">

      <h1>SIPRESENSI 13</h1>

      <div class="school">
        MTsN 13 Ciamis
      </div>

      <div class="subtitle">
        PORTAL ORANG TUA
      </div>


      <input
        type="text"
        id="nisn"
        placeholder="Masukkan NISN anak"
      >


      <input
        type="text"
        id="nama"
        placeholder="Masukkan nama anak"
      >


      <button onclick="loginOrangtua()">
        LIHAT KEHADIRAN
      </button>


      <div id="hasil"></div>

    </div>

  </div>


<script>

  const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbzgKtb2IyODbg4FbgfgWo3XkJ_k0OaL0kU5iZjWH95vqxgzz-nx0iNBwAogH0qwJCYY/exec";


  function loginOrangtua() {

    const nisn =
      document.getElementById("nisn").value.trim();

    const nama =
      document.getElementById("nama").value.trim();

    const hasil =
      document.getElementById("hasil");


    if (!nisn || !nama) {

      hasil.className = "error";

      hasil.innerHTML =
        "⚠️ NISN dan nama siswa harus diisi.";

      return;

    }


    hasil.className = "";

    hasil.innerHTML =
      "⏳ Memeriksa data...";


    const callbackName =
      "hasilLogin_" +
      Date.now();


    window[callbackName] =
      function(response) {

        const script =
          document.getElementById(callbackName);

        if (script) {
          script.remove();
        }

        delete window[callbackName];


        if (response.success) {

          tampilkanData(response);

        } else {

          hasil.className = "error";

          hasil.innerHTML =
            "❌ " +
            (
              response.message ||
              "Login gagal."
            );

        }

      };


    const script =
      document.createElement("script");


    script.id =
      callbackName;


    script.src =
      URL_APPS_SCRIPT +
      "?action=loginOrangtua" +
      "&nisn=" +
      encodeURIComponent(nisn) +
      "&nama=" +
      encodeURIComponent(nama) +
      "&callback=" +
      callbackName;


    script.onerror =
      function() {

        hasil.className = "error";

        hasil.innerHTML =
          "❌ Tidak dapat terhubung ke server.";

        delete window[callbackName];

        script.remove();

      };


    document.body.appendChild(script);

  }


  function tampilkanData(data) {

    const hasil =
      document.getElementById("hasil");

    const akun =
      data.akun;

    const rekap =
      data.rekap;


    let html = `

      <div class="success">

        <h2>✓ LOGIN BERHASIL</h2>

        <div class="nama">
          ${akun.namaSiswa}
        </div>

        <div class="kelas">
          Kelas ${akun.kelas}
        </div>


        <div class="rekap">

          <h3>
            REKAP KEHADIRAN
          </h3>

          <p>
            🟢 Hadir:
            <strong>${rekap.hadir}</strong>
          </p>

          <p>
            🟡 Terlambat:
            <strong>${rekap.terlambat}</strong>
          </p>

          <p>
            🔵 Sakit:
            <strong>${rekap.sakit}</strong>
          </p>

          <p>
            🟠 Izin:
            <strong>${rekap.izin}</strong>
          </p>

          <p>
            🔴 Alpa:
            <strong>${rekap.alpa}</strong>
          </p>

        </div>


        <h3>
          RIWAYAT KEHADIRAN
        </h3>

    `;


    if (
      data.riwayat &&
      data.riwayat.length > 0
    ) {

      data.riwayat.forEach(
        function(item) {

          html += `

            <div class="riwayat">

              <strong>
                ${item.tanggal}
              </strong>

              <br>

              ${item.hari}
              -
              ${item.jam}

              <br>

              Status:
              <strong>
                ${item.status}
              </strong>

            </div>

          `;

        }
      );

    } else {

      html +=
        "<p>Belum ada riwayat kehadiran.</p>";

    }


    html += `

        <button
          class="logout"
          onclick="location.reload()"
        >
          KEMBALI
        </button>

      </div>

    `;


    hasil.innerHTML =
      html;

  }

</script>

</body>

</html>
