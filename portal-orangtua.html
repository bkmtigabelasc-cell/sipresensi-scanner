<script>

  const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbzgKtb2IyODbg4FbgfgWo3XkJ_k0OaL0kU5iZjWH95vqxgzz-nx0iNBwAogH0qwJCYY/exec";


  function loginOrangtua() {

    const nisn =
      document.getElementById("nisn").value.trim();

    const nama =
      document.getElementById("nama").value.trim();

    const hasil =
      document.getElementById("hasil");


    if (!nisn || !nama) {

      hasil.innerHTML =
        "⚠️ NISN dan nama siswa harus diisi.";

      return;

    }


    hasil.innerHTML =
      "⏳ Memeriksa data...";


    const callbackName =
      "hasilLogin_" +
      Date.now();


    window[callbackName] =
      function(response) {

        // Hapus script JSONP
        const script =
          document.getElementById(callbackName);

        if (script) {
          script.remove();
        }


        // Hapus fungsi callback
        delete window[callbackName];


        if (response.success) {

          tampilkanData(response);

        } else {

          hasil.innerHTML =
            "❌ " +
            (response.message ||
             "Login gagal.");

        }

      };


    const script =
      document.createElement("script");


    script.id = callbackName;


    script.src =
      URL_APPS_SCRIPT +
      "?action=loginOrangtua" +
      "&nisn=" +
      encodeURIComponent(nisn) +
      "&nama=" +
      encodeURIComponent(nama) +
      "&callback=" +
      callbackName;


    script.onerror =
      function() {

        hasil.innerHTML =
          "❌ Tidak dapat terhubung ke server.";

        delete window[callbackName];

        script.remove();

      };


    document.body.appendChild(script);

  }


  function tampilkanData(data) {

    const hasil =
      document.getElementById("hasil");


    const akun =
      data.akun;

    const rekap =
      data.rekap;


    let html = `

      <div class="success">

        <h2>✓ LOGIN BERHASIL</h2>

        <div class="nama">
          ${akun.namaSiswa}
        </div>

        <div>
          Kelas ${akun.kelas}
        </div>

        <br>

        <h3>REKAP KEHADIRAN</h3>

        <div>
          Hadir: ${rekap.hadir}
        </div>

        <div>
          Terlambat: ${rekap.terlambat}
        </div>

        <div>
          Sakit: ${rekap.sakit}
        </div>

        <div>
          Izin: ${rekap.izin}
        </div>

        <div>
          Alpa: ${rekap.alpa}
        </div>

        <br>

        <h3>RIWAYAT KEHADIRAN</h3>

    `;


    if (
      data.riwayat &&
      data.riwayat.length > 0
    ) {

      data.riwayat.forEach(function(item) {

        html += `

          <div class="riwayat">

            <strong>
              ${item.tanggal}
            </strong>

            <br>

            ${item.hari} -
            ${item.jam}

            <br>

            Status:
            <strong>
              ${item.status}
            </strong>

          </div>

        `;

      });

    } else {

      html +=
        "<p>Belum ada riwayat kehadiran.</p>";

    }


    html += "</div>";


    hasil.innerHTML = html;

  }

</script>
