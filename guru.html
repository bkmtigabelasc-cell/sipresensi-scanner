<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portal Guru - SIPRESENSI 13</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #f5faf6);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      font-size: 48px;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 8px 0 28px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #4caf50;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2e7d32;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #256b29;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #hasil {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #e8f5e9;
      border-radius: 12px;
      padding: 18px;
      color: #2e7d32;
    }

    .nama {
      font-size: 18px;
      font-weight: bold;
      margin: 8px 0;
    }

    .role {
      color: #555;
      margin-top: 5px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #888;
    }
  </style>

</head>

<body>

  <div class="container">

```
<div class="card">

  <div class="logo">👩‍🏫</div>

  <h1>SIPRESENSI 13</h1>

  <div class="subtitle">
    Portal Guru<br>
    MTsN 13 Ciamis
  </div>

  <label for="nip">NIP</label>

  <input
    type="text"
    id="nip"
    placeholder="Masukkan NIP"
    autocomplete="username"
  >

  <label for="password">Password</label>

  <input
    type="password"
    id="password"
    placeholder="Masukkan password"
    autocomplete="current-password"
  >

  <button
    id="btnLogin"
    onclick="loginGuru()"
  >
    MASUK
  </button>

  <div id="hasil"></div>

</div>

<div class="footer">
  SIPRESENSI 13 • MTsN 13 Ciamis
</div>
```

  </div>

  <script>

    // ==========================================
    // ALAMAT APPS SCRIPT
    // ==========================================

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbzgKtb2IyODbg4FbgfgWo3XkJ_k0OaL0kU5iZjWH95vqxgzz-nx0iNBwAogH0qwJCYY/exec";


    // ==========================================
    // LOGIN GURU
    // ==========================================

    function loginGuru() {

      const nip =
        document.getElementById("nip").value.trim();

      const password =
        document.getElementById("password").value.trim();

      const hasil =
        document.getElementById("hasil");

      const btn =
        document.getElementById("btnLogin");


      // Validasi

      if (!nip || !password) {

        hasil.innerHTML =
          "⚠️ NIP dan password harus diisi.";

        return;
      }


      // Tampilkan proses

      hasil.innerHTML =
        "⏳ Memeriksa akun...";

      btn.disabled = true;


      // Nama callback unik

      const callbackName =
        "hasilLoginGuru_" + Date.now();


      // Fungsi callback

      window[callbackName] =
        function(response) {

          const script =
            document.getElementById(callbackName);

          if (script) {
            script.remove();
          }

          delete window[callbackName];

          btn.disabled = false;


          // Jika berhasil

          if (response.success) {

            tampilkanDashboardAwal(response);

          } else {

            hasil.innerHTML =
              "❌ " +
              (response.message ||
               "Login gagal.");

          }

        };


      // Buat request JSONP

      const script =
        document.createElement("script");

      script.id = callbackName;


      script.src =
        URL_APPS_SCRIPT +
        "?action=loginGuru" +
        "&nip=" +
        encodeURIComponent(nip) +
        "&password=" +
        encodeURIComponent(password) +
        "&callback=" +
        callbackName;


      script.onerror =
        function() {

          hasil.innerHTML =
            "❌ Tidak dapat terhubung ke server.";

          btn.disabled = false;

          delete window[callbackName];

          script.remove();

        };


      document.body.appendChild(script);

    }


    // ==========================================
    // TAMPILKAN HASIL LOGIN
    // ==========================================

    function tampilkanDashboardAwal(data) {

      const hasil =
        document.getElementById("hasil");

      const akun =
        data.akun;


      hasil.innerHTML = `

        <div class="success">

          <div style="font-size:30px;">
            ✓
          </div>

          <div style="font-weight:bold;">
            LOGIN BERHASIL
          </div>

          <div class="nama">
            ${akun.namaGuru}
          </div>

          <div class="role">
            ${akun.role}
          </div>

          <div style="margin-top:10px;font-size:13px;">
            ID Akun: ${akun.idAkunGuru}
          </div>

        </div>

      `;

    }

  </script>

</body>
</html>
