<script>


/****************************************************
 * URL APPS SCRIPT
 ****************************************************/

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbzgKtb2IyODbg4FbgfgWo3XkJ_k0OaL0kU5iZjWH95vqxgzz-nx0iNBwAogH0qwJCYY/exec";


/****************************************************
 * DATA GURU
 ****************************************************/

window.akunGuru = null;


/****************************************************
 * LOGIN GURU
 ****************************************************/

function loginGuru() {

  const nip =
    document
      .getElementById("nip")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value
      .trim();

 const hasil =
  document
    .getElementById("hasilLogin");
  
  const btn =
    document
      .getElementById("btnLogin");


  if (!nip || !password) {

    hasil.innerHTML =
      "⚠️ NIP dan password harus diisi.";

    return;

  }


  hasil.innerHTML =
    "⏳ Memeriksa akun...";

  btn.disabled = true;


  const callbackName =
    "hasilLoginGuru_" +
    Date.now();


  window[callbackName] =
    function(response) {

      const script =
        document
          .getElementById(
            callbackName
          );

      if (script) {
        script.remove();
      }

      delete window[callbackName];

      btn.disabled = false;


      if (response.success) {

        tampilkanDashboardAwal(
          response
        );

      }

      else {

        hasil.innerHTML =
          "❌ " +
          (
            response.message ||
            "Login gagal."
          );

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    URL_APPS_SCRIPT +
    "?action=loginGuru" +
    "&nip=" +
    encodeURIComponent(nip) +
    "&password=" +
    encodeURIComponent(password) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      hasil.innerHTML =
        "❌ Tidak dapat terhubung ke server.";

      btn.disabled = false;

      delete window[callbackName];

      script.remove();

    };


  document.body.appendChild(
    script
  );

}

/****************************************************
 * AMBIL DASHBOARD GURU
 ****************************************************/

function ambilDataDashboardGuru() {

  const callbackName =
    "hasilDashboardGuru_" +
    Date.now();


  window[callbackName] =
    function(response) {

      const script =
        document
          .getElementById(
            callbackName
          );

      if (script) {
        script.remove();
      }

      delete window[callbackName];


      if (!response.success) {

        console.log(
          "Gagal mengambil dashboard:",
          response.message
        );

        return;

      }


      const statistik =
        response.statistik;


      const angkaHadir =
        document
          .getElementById(
            "angkaHadir"
          );

      const angkaTerlambat =
        document
          .getElementById(
            "angkaTerlambat"
          );

      const angkaIzin =
        document
          .getElementById(
            "angkaIzin"
          );

      const angkaSakit =
        document
          .getElementById(
            "angkaSakit"
          );

      const angkaAlpa =
        document
          .getElementById(
            "angkaAlpa"
          );


      if (angkaHadir)
        angkaHadir.textContent =
          statistik.hadir;


      if (angkaTerlambat)
        angkaTerlambat.textContent =
          statistik.terlambat;


      if (angkaIzin)
        angkaIzin.textContent =
          statistik.izin;


      if (angkaSakit)
        angkaSakit.textContent =
          statistik.sakit;


      if (angkaAlpa)
        angkaAlpa.textContent =
          statistik.alpa;

    };


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    URL_APPS_SCRIPT +
    "?action=dashboardGuru" +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      console.log(
        "Tidak dapat mengambil data dashboard."
      );

      delete window[callbackName];

      script.remove();

    };


  document.body.appendChild(
    script
  );

}

/****************************************************

function ambilStatusAbsensiKelas() {

  const select =
    document
      .getElementById(
        "pilihKelas"
      );


  const tempat =
    document
      .getElementById(
        "hasilAbsensiHariIni"
      );


  if (!select || !tempat) {
    return;
  }


  const kelas =
    select.value;


  if (!kelas) {

    tempat.innerHTML = `

      <div class="empty-box">
        Silakan pilih kelas.
      </div>

    `;

    return;

  }


  tempat.innerHTML = `

    <div class="loading">
      ⏳ Mengambil data absensi kelas ${kelas}...
    </div>

  `;


  const callbackName =
    "hasilStatusAbsensiKelas_" +
    Date.now();


  window[callbackName] =
    function(response) {

      const script =
        document
          .getElementById(
            callbackName
          );

        script.remove();

      delete window[callbackName];

        tempat.innerHTML = `

          <div class="empty-box">
            ❌
            ${response.message ||

          </div>

      `;

      delete window[callbackName];

      script.remove();

    };


  document.body.appendChild(
    script
  );

}

/****************************************************
 * STATUS CLASS
 ****************************************************/

function getStatusClass(
  status
) {

  const s =
    String(status || "")
      .trim()
      .toUpperCase();


  if (s === "HADIR") {
    return "status-hadir";
  }

  if (s === "TERLAMBAT") {
    return "status-terlambat";
  }

  if (s === "BELUM ABSEN") {
    return "status-belum";
  }

  if (s === "IZIN") {
    return "status-izin";
  }

  if (s === "SAKIT") {
    return "status-sakit";
  }

  if (s === "ALPA") {
    return "status-alpa";
  }


  return "";

}


/****************************************************
 * STATUS ICON
 ****************************************************/

function getStatusIcon(
  status
) {

  const s =
    String(status || "")
      .trim()
      .toUpperCase();


  if (s === "HADIR") {
    return "🟢";
  }

  if (s === "TERLAMBAT") {
    return "🔴";
  }

  if (s === "BELUM ABSEN") {
    return "🟠";
  }

  if (s === "IZIN") {
    return "🟡";
  }

  if (s === "SAKIT") {
    return "🟣";
  }

  if (s === "ALPA") {
    return "⚫";
  }


  return "⚪";

}


/****************************************************
 * FORMAT TANGGAL INDONESIA
 ****************************************************/

function formatTanggalIndonesia(
  tanggal
) {

  if (!tanggal) {
    return "";
  }


  const bagian =
    tanggal.split("-");


  if (bagian.length !== 3) {
    return tanggal;
  }


  const tahun =
    bagian[0];

  const bulan =
    parseInt(
      bagian[1],
      10
    );

  const hari =
    bagian[2];


  const namaBulan = [

    "",
    "Januari",
    "Februari",
    "Maret",
    "April",
    "Mei",
    "Juni",
    "Juli",
    "Agustus",
    "September",
    "Oktober",
    "November",
    "Desember"

  ];


  return (
    parseInt(hari, 10) +
    " " +
    namaBulan[bulan] +
    " " +
    tahun
  );

}


/****************************************************
 * ESCAPE HTML
 ****************************************************/

function escapeHtml(
  text
) {

  return String(
    text || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
