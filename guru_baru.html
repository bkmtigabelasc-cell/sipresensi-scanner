<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SIPRESENSI 13 - Portal Guru</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f6f9;
      color: #333;
    }

    /* =========================
       LOGIN
    ========================== */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .login-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-title h1 {
      color: #176b3a;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .login-title p {
      color: #777;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #176b3a;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-login:disabled {
      background: #999;
    }

    #pesanLogin {
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
      font-size: 14px;
    }

    /* =========================
       DASHBOARD
    ========================== */

    #dashboardPage {
      display: none;
      min-height: 100vh;
    }

    .header {
      background: #176b3a;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.9;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid white;
      color: white;
      padding: 9px 15px;
      border-radius: 6px;
      cursor: pointer;
    }

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .card h2 {
      color: #176b3a;
      font-size: 18px;
      margin-bottom: 18px;
    }

    /* IDENTITAS */

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .profile-item {
      background: #f7f9fa;
      padding: 13px;
      border-radius: 7px;
    }

    .profile-item small {
      display: block;
      color: #777;
      margin-bottom: 5px;
    }

    .profile-item strong {
      font-size: 14px;
    }

    /* STATISTIK */

    .statistik-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .statistik {
      background: #f7f9fa;
      padding: 18px 10px;
      text-align: center;
      border-radius: 8px;
    }

    .statistik .angka {
      font-size: 25px;
      font-weight: bold;
      color: #176b3a;
      margin-bottom: 5px;
    }

    .statistik .label {
      font-size: 12px;
      color: #666;
    }

    #pesanDashboard {
      margin-top: 15px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 7px;
      font-size: 14px;
    }

    @media (max-width: 700px) {

      .statistik-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .profile-grid {
        grid-template-columns: 1fr;
      }

      .header {
        padding: 15px;
      }

      .header h1 {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>


  <!-- ==================================
       LOGIN
  =================================== -->

  <div id="loginPage" class="login-page">

    <div class="login-box">

      <div class="login-title">
        <h1>SIPRESENSI 13</h1>
        <p>Portal Guru</p>
      </div>

      <div class="form-group">

        <label for="nip">
          NIP
        </label>

        <input
          type="text"
          id="nip"
          placeholder="Masukkan NIP"
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Masukkan password"
        >

      </div>


      <button
        id="btnLogin"
        class="btn-login"
        onclick="loginGuru()"
      >
        LOGIN
      </button>


      <div id="pesanLogin"></div>

    </div>

  </div>



  <!-- ==================================
       DASHBOARD
  =================================== -->

  <div id="dashboardPage">

    <div class="header">

      <div>
        <h1>SIPRESENSI 13</h1>
        <p>Portal Guru</p>
      </div>

      <button
        class="btn-logout"
        onclick="logoutGuru()"
      >
        Logout
      </button>

    </div>


    <div class="container">


      <!-- IDENTITAS GURU -->

      <div class="card">

        <h2>
          Identitas Guru
        </h2>

        <div class="profile-grid">

          <div class="profile-item">

            <small>
              Nama Guru
            </small>

            <strong id="namaGuru">
              -
            </strong>

          </div>


          <div class="profile-item">

            <small>
              NIP
            </small>

            <strong id="nipGuru">
              -
            </strong>

          </div>


          <div class="profile-item">

            <small>
              Role
            </small>

            <strong id="roleGuru">
              -
            </strong>

          </div>


          <div class="profile-item">

            <small>
              Status Akun
            </small>

            <strong id="statusGuru">
              -
            </strong>

          </div>

        </div>

      </div>



      <!-- STATISTIK -->

      <div class="card">

        <h2>
          Statistik Kehadiran
        </h2>


        <div class="statistik-grid">

          <div class="statistik">

            <div
              id="statHadir"
              class="angka"
            >
              0
            </div>

            <div class="label">
              Hadir
            </div>

          </div>


          <div class="statistik">

            <div
              id="statTerlambat"
              class="angka"
            >
              0
            </div>

            <div class="label">
              Terlambat
            </div>

          </div>


          <div class="statistik">

            <div
              id="statIzin"
              class="angka"
            >
              0
            </div>

            <div class="label">
              Izin
            </div>

          </div>


          <div class="statistik">

            <div
              id="statSakit"
              class="angka"
            >
              0
            </div>

            <div class="label">
              Sakit
            </div>

          </div>


          <div class="statistik">

            <div
              id="statAlpa"
              class="angka"
            >
              0
            </div>

            <div class="label">
              Alpa
            </div>

          </div>

        </div>


        <div id="pesanDashboard">
          Menunggu data dashboard...
        </div>

      </div>


    </div>

  </div>



  <script>

    /* ==================================
       URL APPS SCRIPT
    =================================== */

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbzaCM6KNPCNn7F3APcoUrZgMV2leVrewa62lJSIJCGF4ZpOJc0sWw1AXCpdddeBZmjKSA/exec";


    /* ==================================
       DATA AKUN
    =================================== */

    window.akunGuru = null;



    /* ==================================
       LOGIN
    =================================== */

    function loginGuru() {

      const nip =
        document.getElementById("nip")
          .value
          .trim();


      const password =
        document.getElementById("password")
          .value
          .trim();


      const pesan =
        document.getElementById("pesanLogin");


      const tombol =
        document.getElementById("btnLogin");


      if (!nip) {

        pesan.style.color = "red";

        pesan.textContent =
          "NIP wajib diisi.";

        return;
      }


      if (!password) {

        pesan.style.color = "red";

        pesan.textContent =
          "Password wajib diisi.";

        return;
      }


      tombol.disabled = true;

      tombol.textContent =
        "MEMPROSES...";


      pesan.style.color = "#555";

      pesan.textContent =
        "Memeriksa akun...";


      const callbackName =
        "callbackLoginGuru_" +
        Date.now();


      window[callbackName] =
        function(response) {

          console.log(
            "Response login:",
            response
          );


          tombol.disabled = false;

          tombol.textContent =
            "LOGIN";


          if (!response) {

            pesan.style.color = "red";

            pesan.textContent =
              "Tidak ada response dari server.";

            delete window[callbackName];

            return;
          }


          if (!response.success) {

            pesan.style.color = "red";

            pesan.textContent =
              response.message ||
              "Login gagal.";

            delete window[callbackName];

            return;
          }


          /* LOGIN BERHASIL */

          window.akunGuru =
            response.akun;


          pesan.style.color =
            "green";

          pesan.textContent =
            "Login berhasil.";


          tampilkanDashboard();


          delete window[callbackName];

        };


      const script =
        document.createElement("script");


      script.src =
        URL_APPS_SCRIPT +
        "?action=loginGuru" +
        "&nip=" +
        encodeURIComponent(nip) +
        "&password=" +
        encodeURIComponent(password) +
        "&callback=" +
        callbackName;


      script.onerror =
        function() {

          tombol.disabled = false;

          tombol.textContent =
            "LOGIN";

          pesan.style.color =
            "red";

          pesan.textContent =
            "Gagal terhubung ke server.";

          delete window[callbackName];

        };


      document.body.appendChild(script);

    }



    /* ==================================
       TAMPILKAN DASHBOARD
    =================================== */

    function tampilkanDashboard() {

      const akun =
        window.akunGuru;


      if (!akun) {

        console.error(
          "Data akun tidak ditemukan."
        );

        return;
      }


      /* IDENTITAS */

      document.getElementById("namaGuru")
        .textContent =
        akun.namaGuru || "-";


      document.getElementById("nipGuru")
        .textContent =
        akun.nip || "-";


      document.getElementById("roleGuru")
        .textContent =
        akun.role || "-";


      document.getElementById("statusGuru")
        .textContent =
        akun.statusAkun || "-";


      /* TAMPILKAN DASHBOARD */

      document.getElementById("loginPage")
        .style.display =
        "none";


      document.getElementById("dashboardPage")
        .style.display =
        "block";


      /* PANGGIL DATA DASHBOARD */

      ambilDashboardGuru();

    }



    /* ==================================
       AMBIL DASHBOARD GURU
    =================================== */

    function ambilDashboardGuru() {

      const pesan =
        document.getElementById(
          "pesanDashboard"
        );


      pesan.textContent =
        "Mengambil data dashboard...";


      const callbackName =
        "callbackDashboardGuru_" +
        Date.now();


      window[callbackName] =
        function(response) {

          console.log(
            "Response dashboardGuru:",
            response
          );


          if (!response) {

            pesan.textContent =
              "Tidak ada response dashboard.";

            delete window[callbackName];

            return;
          }


          if (!response.success) {

            pesan.textContent =
              response.message ||
              "Gagal mengambil dashboard.";

            delete window[callbackName];

            return;
          }


          /* =========================
             STATISTIK
          ========================== */

          const statistik =
            response.statistik || {};


          document.getElementById(
            "statHadir"
          ).textContent =
            statistik.hadir || 0;


          document.getElementById(
            "statTerlambat"
          ).textContent =
            statistik.terlambat || 0;


          document.getElementById(
            "statIzin"
          ).textContent =
            statistik.izin || 0;


          document.getElementById(
            "statSakit"
          ).textContent =
            statistik.sakit || 0;


          document.getElementById(
            "statAlpa"
          ).textContent =
            statistik.alpa || 0;


          pesan.textContent =
            response.message ||
            "Data dashboard berhasil diambil.";


          delete window[callbackName];

        };


      const script =
        document.createElement("script");


      script.src =
        URL_APPS_SCRIPT +
        "?action=dashboardGuru" +
        "&callback=" +
        callbackName;


      script.onerror =
        function() {

          pesan.textContent =
            "Gagal terhubung ke dashboard.";

          delete window[callbackName];

        };


      document.body.appendChild(script);

    }



    /* ==================================
       LOGOUT
    =================================== */

    function logoutGuru() {

      window.akunGuru = null;


      document.getElementById(
        "dashboardPage"
      ).style.display =
        "none";


      document.getElementById(
        "loginPage"
      ).style.display =
        "flex";


      document.getElementById("nip")
        .value = "";


      document.getElementById("password")
        .value = "";


      document.getElementById(
        "pesanLogin"
      ).textContent = "";

    }



    /* ==================================
       ENTER UNTUK LOGIN
    =================================== */

    document
      .getElementById("password")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            loginGuru();

          }

        }
      );

  </script>

</body>
</html>
