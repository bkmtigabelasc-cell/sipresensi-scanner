<script>

/*
====================================================
 KONFIGURASI APPS SCRIPT
====================================================
*/

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbzaCM6KNPCNn7F3APcoUrZgMV2leVrewa62lJSIJCGF4ZpOJc0sWw1AXCpdddeBZmjKSA/exec";


/*
====================================================
 LOGIN GURU
====================================================
*/

function loginGuru() {

  const nip =
    document.getElementById("nip").value.trim();

  const password =
    document.getElementById("password").value.trim();

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("btnLogin");


  /*
  ----------------------------------------------
  VALIDASI
  ----------------------------------------------
  */

  if (!nip) {

    tampilkanPesan(
      "NIP harus diisi.",
      "error"
    );

    return;
  }


  if (!password) {

    tampilkanPesan(
      "Password harus diisi.",
      "error"
    );

    return;
  }


  /*
  ----------------------------------------------
  TAMPILKAN LOADING
  ----------------------------------------------
  */

  tampilkanPesan(
    "⏳ Sedang memeriksa akun...",
    "loading"
  );

  button.disabled = true;


  /*
  ----------------------------------------------
  BUAT CALLBACK JSONP
  ----------------------------------------------
  */

  const callbackName =
    "loginGuruCallback_" + Date.now();


  window[callbackName] =
    function(response) {

      /*
      Hapus script JSONP
      */

      const script =
        document.getElementById(callbackName);

      if (script) {
        script.remove();
      }


      delete window[callbackName];


      button.disabled = false;


      /*
      ------------------------------------------
      CEK RESPONSE
      ------------------------------------------
      */

      console.log(
        "Response login guru:",
        response
      );


      if (!response) {

        tampilkanPesan(
          "Server tidak mengirim response.",
          "error"
        );

        return;
      }


      /*
      ------------------------------------------
      LOGIN BERHASIL
      ------------------------------------------
      */

      if (response.success === true) {

        tampilkanPesan(
          "✅ Login berhasil.",
          "success"
        );


        tampilkanDataGuru(
          response
        );


        return;
      }


      /*
      ------------------------------------------
      LOGIN GAGAL
      ------------------------------------------
      */

      tampilkanPesan(
        "❌ " +
        (
          response.message ||
          "NIP atau password salah."
        ),
        "error"
      );

    };


  /*
  ----------------------------------------------
  BUAT SCRIPT JSONP
  ----------------------------------------------
  */

  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.src =
    URL_APPS_SCRIPT +
    "?action=loginGuru" +
    "&nip=" +
    encodeURIComponent(nip) +
    "&password=" +
    encodeURIComponent(password) +
    "&callback=" +
    encodeURIComponent(callbackName);


  /*
  ----------------------------------------------
  JIKA GAGAL TERHUBUNG
  ----------------------------------------------
  */

  script.onerror =
    function() {

      button.disabled = false;


      tampilkanPesan(
        "❌ Tidak dapat terhubung ke Apps Script.",
        "error"
      );


      delete window[callbackName];

      script.remove();

    };


  /*
  ----------------------------------------------
  KIRIM REQUEST
  ----------------------------------------------
  */

  document.body.appendChild(script);

}


/*
====================================================
 TAMPILKAN PESAN
====================================================
*/

function tampilkanPesan(
  teks,
  tipe
) {

  const message =
    document.getElementById("message");


  message.textContent =
    teks;


  message.className =
    "message " + tipe;

}


/*
====================================================
 TAMPILKAN DATA GURU
====================================================
*/

function tampilkanDataGuru(
  response
) {

  const hasil =
    document.getElementById("hasilGuru");


  const akun =
    response.akun;


  if (!akun) {

    hasil.style.display =
      "block";

    hasil.innerHTML =
      "<strong>Login berhasil.</strong><br>" +
      "Namun data akun tidak ditemukan dalam response.";

    return;
  }


  /*
  Simpan sementara
  */

  window.akunGuru =
    akun;


  hasil.style.display =
    "block";


  hasil.innerHTML = `

    <div class="result-card">

      <strong>Login berhasil ✅</strong>

      <br><br>

      <strong>Nama:</strong><br>
      ${escapeHtml(
        akun.namaGuru || "-"
      )}

      <br>

      <strong>NIP:</strong><br>
      ${escapeHtml(
        akun.nip || "-"
      )}

      <br>

      <strong>Role:</strong><br>
      ${escapeHtml(
        akun.role || "-"
      )}

      <br>

      <strong>Status Akun:</strong><br>
      ${escapeHtml(
        akun.statusAkun || "-"
      )}

    </div>

  `;

}


/*
====================================================
 ESCAPE HTML
====================================================
*/

function escapeHtml(
  text
) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>
